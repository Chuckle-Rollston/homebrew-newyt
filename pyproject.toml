[project]
name = "newyt"
version = "0.1.0"
description = "A terminal YouTube client: your own recommendations, ASCII thumbnails, private playback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.40",
    "Pillow>=10.0",
    "requests>=2.31",
]

[project.scripts]
newyt = "newyt.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newyt*"]
